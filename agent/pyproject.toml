[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowtrace-agent"
version = "0.1.0"
description = "ShadowTrace EDR endpoint agent"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "watchdog>=6.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shadowtrace-agent = "shadowtrace_agent.cli:main"

[tool.setuptools.packages.find]
include = ["shadowtrace_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
