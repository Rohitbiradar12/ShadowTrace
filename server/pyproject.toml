[project]
name = "shadowtrace-server"
version = "0.1.0"
description = "ShadowTrace EDR central server: ingest, detection, alerting, response"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "beanie>=2.0",
    "pymongo>=4.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
